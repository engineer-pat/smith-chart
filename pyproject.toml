[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smithlib"
version = "0.1.0"
description = "Smith chart mathematics, plotting, and matching-network design"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
app = ["streamlit>=1.30", "plotly>=5.18", "matplotlib>=3.7"]
docs = ["jupyter", "matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7", "plotly>=5.18", "streamlit>=1.30"]

[tool.setuptools]
packages = ["smithlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
