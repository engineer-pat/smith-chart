# GENERATED FILE -- do not edit by hand.
#
#     python scripts/gen_streamlit_theme.py
#
# Streamlit reads this once at server start, so its chrome cannot follow the
# palette at runtime the way the charts do. Generating it from
# smithlib/style.py keeps the app frame and the chart surface the same colour.
# Edit the palettes there, then re-run the command above (`make theme`).
#
# `base` sets which theme the app opens in; the Settings menu (under the app's
# top-right menu) switches it per browser, and the charts follow.

[theme]
base = "dark"
font = "sans-serif"
showWidgetBorder = true

[theme.light]
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f2f1ec"
textColor = "#0b0b0b"
primaryColor = "#2a78d6"
linkColor = "#2a78d6"
borderColor = "#bab9b1"
dataframeBorderColor = "#bab9b1"
dataframeHeaderBackgroundColor = "#f2f1ec"
codeBackgroundColor = "#f2f1ec"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#4a3aa7"]

[theme.dark]
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#242422"
textColor = "#ffffff"
primaryColor = "#3987e5"
linkColor = "#3987e5"
borderColor = "#4d4c47"
dataframeBorderColor = "#4d4c47"
dataframeHeaderBackgroundColor = "#242422"
codeBackgroundColor = "#242422"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#9085e9"]

[browser]
gatherUsageStats = false
